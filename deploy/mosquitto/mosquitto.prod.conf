# Production broker. Credentials are generated at container start (entrypoint.prod.sh).
# The TLS listener on 8883 is appended by the entrypoint when /mosquitto/certs holds fullchain.pem and privkey.pem.
listener 1883
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl

# Persistent sessions survive a broker restart, so QoS 1 messages queued for the ingest
# subscriber while it is away (deploy, crash) are not lost.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 200000
max_inflight_messages 512
