# Dev broker. Credentials are generated at container start (see compose file).
listener 1883
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl
persistence false

# Persistent sessions: queue QoS 1 messages for a subscriber that is away (restart, deploy)
# instead of dropping them. The default of 1000 would silently drop data during longer outages.
max_queued_messages 200000
# Matches the subscriber's Receive Maximum, which bounds its unacknowledged messages.
max_inflight_messages 512
