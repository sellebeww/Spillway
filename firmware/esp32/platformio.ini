[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; Host build: unit tests of the portable core against the protocol golden vectors.
; Run: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
